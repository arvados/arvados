- name: "Install nginx {{ arvados_nginx_service_key }} certificates"
  ansible.builtin.include_tasks: install_cert_file.yml
  loop:
    - cert
    - key

- name: Add nginx secret service
  when: tls_source.key.aws_secret is defined
  become: yes
  ansible.builtin.copy:
    src: aws_secret.conf
    dest: /etc/systemd/system/nginx.service.d/aws_secret.conf
    owner: root
    group: root
    mode: 0644
  register: nginx_service_definition
  notify:
    - restart nginx

- name: Set up htpasswd
  when: arvados_nginx_proxy_service.BasicUser is defined
  block:
    - name: Install passlib
      become: yes
      ansible.builtin.apt:
        name:
          - python3-passlib

    - name: Write htpasswd user
      become: yes
      no_log: yes
      community.general.htpasswd:
        name: "{{ arvados_nginx_proxy_service.BasicUser }}"
        state: "{{ 'present' if arvados_nginx_proxy_service.BasicPass is defined else 'absent' }}"
        password: "{{ arvados_nginx_proxy_service.BasicPass|default(omit) }}"
        hash_scheme: "{{ arvados_nginx_proxy_service.BasicScheme|default(omit) }}"
        path: "{{ arvados_nginx_htpasswd_path }}"
        owner: root
        group: www-data
        mode: 0640

- name: "Set up nginx {{ arvados_nginx_service_key }} site"
  become: yes
  ansible.builtin.template:
    src: "arvados-nginx-{{ arvados_nginx_service_key|lower }}.conf.j2"
    dest: "/etc/nginx/sites-available/arvados-{{ arvados_nginx_service_key|lower }}"
    owner: root
    group: root
    mode: 0644
  notify:
    - restart nginx
  register: arvados_nginx_site

- name: "Enable nginx {{ arvados_nginx_service_key }} site"
  become: yes
  ansible.builtin.file:
    state: link
    src: "{{ arvados_nginx_site.dest }}"
    dest: "{{ arvados_nginx_site.dest|replace('/sites-available/', '/sites-enabled/') }}"
  notify:
    - restart nginx
