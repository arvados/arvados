- name: Install Grafana
  become: yes
  ansible.builtin.apt:
    name: grafana

- name: Write Grafana config
  when: arvados_ansible_services.Grafana.ConfigFile is defined
  become: yes
  no_log: yes
  ansible.builtin.copy:
    src: "{{ arvados_ansible_services.Grafana.ConfigFile }}"
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: 0640
  register: arvados_grafana_config_copy

- name: Start and enable grafana
  become: yes
  ansible.builtin.systemd_service:
    name: grafana-server.service
    state: "{{ 'restarted' if arvados_grafana_config_copy.changed else 'started' }}"
    enabled: true
